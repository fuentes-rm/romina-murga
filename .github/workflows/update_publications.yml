name: Sync and Update Publications

permissions: {}

on:
  # 1. Run automatically whenever RMurga.bib or publication scripts are modified
  push:
    branches:
      - master
      - main
    paths:
      - 'files/RMurga.bib'
      - 'scripts/update_publications.py'
      - 'scripts/sync_orcid_publications.py'
  # 2. Run automatically every Monday at 08:00 UTC to fetch new papers from ORCID
  schedule:
    - cron: '0 8 * * 1'
  # 3. Allow manual execution from the GitHub Actions tab
  workflow_dispatch:
    inputs:
      sync_orcid:
        description: 'Fetch new publications from ORCID API before regenerating files'
        required: false
        default: 'true'
        type: boolean

jobs:
  update-publications:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: |
          pip install --disable-pip-version-check pyyaml==6.0.2 bibtexparser==1.4.3

      - name: Sync ORCID and regenerate publication files
        env:
          EVENT_NAME: ${{ github.event_name }}
          SYNC_ORCID: ${{ inputs.sync_orcid }}
        run: |
          if [ "$EVENT_NAME" = "push" ] || [ "$SYNC_ORCID" = "false" ]; then
            python3 scripts/sync_orcid_publications.py --bib-only
          else
            python3 scripts/sync_orcid_publications.py
          fi

      - name: Commit and push updated publications
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add files/RMurga.bib _publications/ _data/cv.json
          if git diff --cached --quiet; then
            echo "No publication changes to commit."
          else
            git commit -m "chore(publications): automated sync and update of publications"
            git push
          fi
